<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROJECT STARGAZER</title>
  <!-- カウントダウンのフォント（Google Fonts）。text= で使う文字だけに絞って、読み込みを軽くしている -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200&text=0123456789%3A.&display=swap" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- 3Dを描くキャンバス。画面に固定されていて、スクロールしても動かない -->
  <canvas id="canvas"></canvas>

  <!-- 読み込み中に表示する数字（0〜100） -->
  <div id="loading">0</div>

  <!-- スクロールする文字の部分 -->
  <main id="content">
    <section class="section">
      <!-- 中の数字は main.js が毎フレーム書き換える（「7. カウントダウン」） -->
      <h2 class="countdown">00:00:00:00.00</h2>
    </section>

    <section class="section">
      <h2 class="countdown">00:00:00:00.00</h2>
    </section>

    <section class="section">
      <h2 class="countdown">00:00:00:00.00</h2>
    </section>

    <section class="section">
      <h2 class="countdown">00:00:00:00.00</h2>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
